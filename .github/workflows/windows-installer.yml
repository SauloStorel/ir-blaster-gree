# Compila o painel numa máquina Windows e publica o instalador (.exe) como artefato.
name: Instalador do Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/windows-installer.yml"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: npm ci

      - run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
